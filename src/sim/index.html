<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bst dev</title>
<style>
  :root { color-scheme: dark; --bg: #0d0f12; --panel: #16191e; --line: #262a31; --text: #d9dde3; --dim: #8a919b; --accent: #e23b3b; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 1fr 340px; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  #main { display: grid; grid-template-rows: auto 1fr; min-width: 0; }
  #bar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #bar button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  #bar button:hover { border-color: var(--dim); }
  #bar label { display: flex; gap: 6px; align-items: center; color: var(--dim); }
  #page { min-width: 60px; font-weight: 600; color: var(--text); }
  #reveal { width: 180px; }
  #stage { position: relative; overflow: hidden; margin: 16px; }
  #screen { position: absolute; left: 0; top: 0; width: 853px; height: 533px; transform-origin: 0 0; background: #000; overflow: hidden; border-radius: 6px; box-shadow: 0 0 0 1px var(--line); }
  #carplay { position: absolute; display: grid; place-items: center; color: #fff8; font: 600 22px system-ui; background: linear-gradient(135deg, #2b7a9e, #5fd3c4 55%, #2a4fc0); }
  #band { position: absolute; display: flex; gap: 10px; align-items: center; padding: 0 12px; background: #0b0b0d; border-top: 1px solid #1d2026; color: #8a8f99; font: 600 11px system-ui; letter-spacing: 1px; }
  #band span { padding: 10px 12px; border-radius: 10px; background: #17171b; }
  #theme { position: absolute; left: 0; top: 0; height: 533px; width: 128px; }
  aside { border-left: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr auto 40%; min-height: 0; }
  aside h2 { margin: 0; padding: 10px 14px; font-size: 11px; letter-spacing: 1.4px; color: var(--dim); border-bottom: 1px solid var(--line); }
  #log { margin: 0; padding: 6px 14px; list-style: none; overflow: auto; font: 12px ui-monospace, monospace; }
  #log li { padding: 2px 0; color: var(--dim); }
  #log .refused { color: #e0a33a; }
  #log .error { color: var(--accent); }
  #log .info { color: #6fb3ff; }
  #state { margin: 0; padding: 8px 14px; overflow: auto; font: 11px ui-monospace, monospace; color: var(--dim); }
</style>
</head>
<body>
<div id="main">
  <div id="bar">
    <button id="back">◀ Back</button>
    <button id="next">Next ▶</button>
    <span id="page">closed</span>
    <label>drag <input id="reveal" type="range" min="0" value="0"></label>
    <label><input id="enabled" type="checkbox"> control enabled</label>
    <label><input id="connected" type="checkbox"> car connected</label>
    <button id="reset">Reset car</button>
  </div>
  <div id="stage">
    <div id="screen">
      <div id="carplay">CarPlay</div>
      <div id="band"><span>HOME</span><span>BYTESHIFT</span><span>N – N – N</span></div>
      <div id="theme"></div>
    </div>
  </div>
</div>
<aside>
  <h2>COMMANDS</h2>
  <ul id="log"></ul>
  <h2>CAR STATE</h2>
  <pre id="state"></pre>
</aside>
<script src="/__sim/sim.js"></script>
</body>
</html>
